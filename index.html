<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍁 栖霞猫猫山 · 枫客松 AI 视频</title>
<style>
  :root { --orange:#e8590c; --ink:#1f2937; --muted:#6b7280; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: linear-gradient(180deg,#fff7ed 0%,#ffffff 40%); color:var(--ink); }
  .wrap { max-width: 960px; margin:0 auto; padding: 40px 20px 64px; }
  header { text-align:center; margin-bottom: 32px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); margin:0 0 8px; }
  .sub { color:var(--muted); margin:0; }
  .badges { margin-top:16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .badge { background:#fff; border:1px solid #fde0d2; color:var(--orange); padding:4px 12px; border-radius:999px; font-size:13px; }
  section { margin-top:40px; }
  h2 { font-size:1.2rem; border-left:4px solid var(--orange); padding-left:10px; }
  video { width:100%; border-radius:12px; background:#000; display:block; }
  .main video { max-height:72vh; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
  @media (max-width:680px){ .grid{ grid-template-columns:1fr; } }
  .grid video { max-height:62vh; }
  .note { color:var(--muted); font-size:13px; margin-top:6px; text-align:center; }
  .links { margin-top:44px; display:flex; gap:16px; justify-content:center; flex-wrap:wrap; }
  .links a { text-decoration:none; color:var(--orange); border:1px solid #fde0d2; background:#fff; padding:10px 20px; border-radius:999px; font-weight:600; }
  .links a:hover { background:#fff7ed; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🍁 栖霞猫猫山</h1>
    <p class="sub">栖霞山红枫节「枫客松」参赛作品 · 85% 镜头由 AI 生成</p>
    <div class="badges">
      <span class="badge">AI 生成 85%</span>
      <span class="badge">1 主片 + 3 切片</span>
      <span class="badge">文生视频 + 图生视频</span>
    </div>
  </header>

  <section class="main">
    <h2>主宣传片 · 2分42秒（横屏）</h2>
    <video controls preload="metadata" poster="封面.jpg">
      <source src="主宣传片.mp4" type="video/mp4">
      你的浏览器不支持视频播放。
    </video>
  </section>

  <section>
    <h2>抖音传播切片（竖屏）</h2>
    <div class="grid">
      <div><video controls preload="metadata" src="抖音版本1.mp4"></video><p class="note">切片 1 · 10秒</p></div>
      <div><video controls preload="metadata" src="抖音版本2.mp4"></video><p class="note">切片 2 · 12秒</p></div>
      <div><video controls preload="metadata" src="抖音版本3.mp4"></video><p class="note">切片 3 · 15秒</p></div>
    </div>
  </section>

  <div class="links">
    <a href="创作说明.pdf" target="_blank">📄 创作说明</a>
    <a href="标题与发布文案.txt" target="_blank">📝 发布文案</a>
    <a href="https://github.com/gao666-max/qixia-cat-mountain" target="_blank">GitHub 仓库 ↗</a>
  </div>
</div>
</body>
</html>
